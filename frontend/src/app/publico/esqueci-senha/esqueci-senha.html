<app-tela-acesso
  titulo="Recuperar senha"
  subtitulo="Informe seu e-mail e enviaremos um link para criar uma nova senha."
>
  <form [formGroup]="form" (ngSubmit)="enviar()">
    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <mat-icon matPrefix fontSet="material-symbols-outlined">mail</mat-icon>
      <input matInput type="email" formControlName="email" autocomplete="email" />
    </mat-form-field>
    @if (enviado()) {
      <p class="sucesso" role="status">
        Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.
      </p>
    }
    @if (erro()) {
      <p class="erro" role="alert">Não foi possível enviar o link. Tente novamente.</p>
    }
    <button
      mat-flat-button
      class="botao-destaque"
      type="submit"
      [disabled]="form.invalid || enviando()"
    >
      Enviar link
    </button>
  </form>
  <div class="links">
    <a mat-button routerLink="/login">Voltar ao login</a>
  </div>
</app-tela-acesso>
