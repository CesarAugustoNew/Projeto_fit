<mat-card class="cartao">
  <mat-card-header>
    <mat-card-title>Servidor indisponível</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Não foi possível conectar ao servidor. Verifique sua internet e tente de novo.</p>
    <div class="acoes">
      <button mat-flat-button type="button" (click)="tentarDeNovo()">Tentar de novo</button>
    </div>
  </mat-card-content>
</mat-card>
