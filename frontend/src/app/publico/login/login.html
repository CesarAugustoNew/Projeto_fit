<mat-card class="cartao">
  <mat-card-header>
    <mat-card-title>Entrar</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="entrar()">
      <mat-form-field>
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" autocomplete="current-password" />
      </mat-form-field>
      @if (erro()) {
        <p class="erro" role="alert">{{ erro() }}</p>
      }
      <button mat-flat-button type="submit" [disabled]="form.invalid || enviando()">Entrar</button>
    </form>
    <div class="links">
      <a mat-button routerLink="/esqueci-senha">Esqueci minha senha</a>
    </div>
  </mat-card-content>
</mat-card>
