<app-tela-acesso titulo="Entrar" subtitulo="Use o e-mail e a senha da sua conta.">
  <form [formGroup]="form" (ngSubmit)="entrar()">
    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <mat-icon matPrefix fontSet="material-symbols-outlined">mail</mat-icon>
      <input matInput type="email" formControlName="email" autocomplete="email" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Senha</mat-label>
      <mat-icon matPrefix fontSet="material-symbols-outlined">lock</mat-icon>
      <input
        matInput
        [type]="senhaVisivel() ? 'text' : 'password'"
        formControlName="senha"
        autocomplete="current-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        [attr.aria-label]="senhaVisivel() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="senhaVisivel()"
        (click)="senhaVisivel.set(!senhaVisivel())"
      >
        <mat-icon fontSet="material-symbols-outlined">
          {{ senhaVisivel() ? 'visibility_off' : 'visibility' }}
        </mat-icon>
      </button>
    </mat-form-field>
    <a class="esqueci" routerLink="/esqueci-senha">Esqueci minha senha</a>
    @if (erro()) {
      <p class="erro" role="alert">{{ erro() }}</p>
    }
    <button
      mat-flat-button
      class="botao-destaque"
      type="submit"
      [disabled]="form.invalid || enviando()"
    >
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</app-tela-acesso>
