<app-tela-acesso titulo="Definir senha" subtitulo="Crie a senha que você vai usar para entrar.">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <mat-form-field appearance="outline">
      <mat-label>Nova senha</mat-label>
      <mat-icon matPrefix fontSet="material-symbols-outlined">lock</mat-icon>
      <input matInput type="password" formControlName="senha" autocomplete="new-password" />
      <mat-hint>Mínimo de 8 caracteres</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Confirmar senha</mat-label>
      <mat-icon matPrefix fontSet="material-symbols-outlined">lock</mat-icon>
      <input matInput type="password" formControlName="confirmar" autocomplete="new-password" />
    </mat-form-field>
    @if (erro()) {
      <p class="erro" role="alert">{{ erro() }}</p>
    }
    <button
      mat-flat-button
      class="botao-destaque"
      type="submit"
      [disabled]="form.invalid || enviando()"
    >
      Salvar senha
    </button>
  </form>
  <div class="links">
    <a mat-button routerLink="/login">Voltar ao login</a>
  </div>
</app-tela-acesso>
