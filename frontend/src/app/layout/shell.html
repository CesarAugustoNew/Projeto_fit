<ng-template #barra>
  <mat-toolbar color="primary">
    <span class="titulo">{{ titulo() }}</span>
    <span class="espaco"></span>
    <button mat-icon-button class="sair" type="button" aria-label="Sair" (click)="sair()">
      <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
    </button>
  </mat-toolbar>
</ng-template>

@if (celular()) {
  <div class="celular">
    <ng-container *ngTemplateOutlet="barra" />
    <main class="conteudo"><router-outlet /></main>
    <nav class="nav-inferior" aria-label="Navegação principal">
      @for (item of itens(); track item.rota) {
        <a [routerLink]="item.rota" routerLinkActive="ativo">
          <mat-icon fontSet="material-symbols-outlined">{{ item.icone }}</mat-icon>
          <span>{{ item.rotulo }}</span>
        </a>
      }
    </nav>
  </div>
} @else {
  <div class="desktop">
    <ng-container *ngTemplateOutlet="barra" />
    <mat-sidenav-container class="container">
      <mat-sidenav mode="side" opened>
        <nav class="nav-lateral" aria-label="Navegação principal">
          @for (item of itens(); track item.rota) {
            <a [routerLink]="item.rota" routerLinkActive="ativo">
              <mat-icon fontSet="material-symbols-outlined">{{ item.icone }}</mat-icon>
              <span>{{ item.rotulo }}</span>
            </a>
          }
        </nav>
      </mat-sidenav>
      <mat-sidenav-content class="conteudo"><router-outlet /></mat-sidenav-content>
    </mat-sidenav-container>
  </div>
}
