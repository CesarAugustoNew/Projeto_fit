<p class="media">
  @if (media() !== null) {
    Aderência média: {{ media() }}%
  } @else {
    Sem ficha no período
  }
</p>
<div class="grafico">
  <canvas baseChart type="bar" [data]="dados()" [options]="opcoes()"></canvas>
</div>
@if (temSemanaSemFicha()) {
  <p class="legenda">Semanas sem barra: sem ficha ativa.</p>
}
