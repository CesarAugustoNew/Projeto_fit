@if (pontos().length === 0) {
  <p class="vazio">Ainda não há treinos com este exercício no período.</p>
} @else {
  <mat-button-toggle-group
    aria-label="Medida do gráfico"
    [value]="medida()"
    (change)="medida.set($event.value)"
  >
    <mat-button-toggle value="carga">Carga</mat-button-toggle>
    <mat-button-toggle value="volume">Volume</mat-button-toggle>
  </mat-button-toggle-group>
  @if (semCarga()) {
    <p class="vazio">Exercício sem carga registrada. Veja o volume ou o histórico de treinos.</p>
  } @else {
    <div class="grafico">
      <canvas baseChart type="line" [data]="dados()" [options]="opcoes"></canvas>
    </div>
  }
}
